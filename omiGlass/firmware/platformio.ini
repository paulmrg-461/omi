[env:seeed_xiao_esp32s3]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 921600
build_flags = 
    -DCAMERA_MODEL_XIAO_ESP32S3
    -DCORE_DEBUG_LEVEL=3
    -DBOARD_HAS_PSRAM
    -DDISABLE_OPUS
lib_deps =
    bblanchon/ArduinoJson @ ^6.21.3
    WebSockets
    espressif/esp32-camera @ ^2.0.0

[env:seeed_xiao_esp32s3_slow]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 921600
build_flags = 
    -DCAMERA_MODEL_XIAO_ESP32S3
    -DCORE_DEBUG_LEVEL=3
    -DBOARD_HAS_PSRAM
    -DDISABLE_OPUS
lib_deps =
    bblanchon/ArduinoJson @ ^6.21.3
    WebSockets
    espressif/esp32-camera @ ^2.0.0
